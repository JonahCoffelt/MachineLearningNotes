[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-notes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "matplotlib"]

[tool.setuptools]
packages = ["Helpers", "NeuralNetworks", "Visualization"]
